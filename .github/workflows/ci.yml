name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_scaffold.py
      - name: Validate docs and stability surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("STATUS.md"),
              Path("GAPS.md"),
              Path("PARITY.md"),
              Path("docs/toolchain.md"),
              Path("docs/provenance.md"),
              Path("docs/traceability/first-push-families.md"),
              Path("flake.nix"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Missing required docs/stability files: " + ", ".join(missing))
          PY
